name: Build America Audit macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source_payload/**"
      - "automation_payload/**"
      - "rtu_robustness_payload/**"
      - "rtu_engine_v2_payload/**"
      - "rtu_engine_v2_hotfix_payload/**"
      - "rtu_engine_v3_payload/**"
      - "client_delete_payload/**"
      - "packaging/macos/**"
      - "packaging/windows/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build-macos:
    name: build-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct America Audit source
        shell: bash
        run: |
          set -euo pipefail

          parts=(source_payload/payload_*.txt)
          if [ "${#parts[@]}" -ne 8 ]; then
            echo "Expected 8 source payload chunks; found ${#parts[@]}." >&2
            exit 1
          fi

          cat "${parts[@]}" | tr -d '\r\n\t ' > AmericaAudit_Desktop_1.0.0_Windows_Builder_v2.zip.b64

          python3 - <<'PY'
          import base64
          from pathlib import Path

          src = Path("AmericaAudit_Desktop_1.0.0_Windows_Builder_v2.zip.b64")
          out = Path("AmericaAudit_Desktop_1.0.0_Windows_Builder_v2.zip")
          data = base64.b64decode(src.read_text(encoding="ascii"))
          if len(data) < 500_000:
              raise SystemExit(f"Reconstructed archive is unexpectedly small: {len(data)} bytes")
          out.write_bytes(data)
          print(f"Archive bytes: {len(data)}")
          PY

          ditto -x -k AmericaAudit_Desktop_1.0.0_Windows_Builder_v2.zip src

          test -f src/AmericaAudit_Desktop_1.0.0/desktop/desktop_launcher.py
          test -f src/AmericaAudit_Desktop_1.0.0/frontend/package-lock.json

      - name: Apply automation upgrade
        shell: bash
        run: |
          set -euo pipefail

          parts=(automation_payload/overlay_*.txt)
          if [ "${#parts[@]}" -ne 4 ]; then
            echo "Expected 4 automation overlay chunks; found ${#parts[@]}." >&2
            exit 1
          fi

          cat "${parts[@]}" | tr -d '\r\n\t ' > america_audit_automation_overlay.zip.b64

          python3 - <<'PY'
          import base64
          from pathlib import Path

          src = Path("america_audit_automation_overlay.zip.b64")
          out = Path("america_audit_automation_overlay.zip")
          data = base64.b64decode(src.read_text(encoding="ascii"))
          if len(data) < 20_000:
              raise SystemExit(f"Automation overlay is unexpectedly small: {len(data)} bytes")
          out.write_bytes(data)
          print(f"Automation overlay bytes: {len(data)}")
          PY

          project="src/AmericaAudit_Desktop_1.0.0"
          ditto -x -k america_audit_automation_overlay.zip "$project"

          grep -q "Crear automáticamente desde RTU" "$project/frontend/src/pages/Clients.tsx"
          grep -q "Cargar y convertir automáticamente" "$project/frontend/src/pages/Conversion.tsx"
          grep -q "/create-client" "$project/backend/app/taxpayer_profile/router.py"

          echo "Automation upgrade applied successfully."

      - name: Apply OCR/document runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail

          parts=(rtu_robustness_payload/overlay_*.txt)
          if [ "${#parts[@]}" -ne 7 ]; then
            echo "Expected 7 RTU runtime prerequisite chunks; found ${#parts[@]}." >&2
            exit 1
          fi

          cat "${parts[@]}" | tr -d '\r\n\t ' > america_audit_rtu_runtime_prerequisites.zip.b64

          python3 - <<'PY'
          import base64
          from pathlib import Path

          src = Path("america_audit_rtu_runtime_prerequisites.zip.b64")
          out = Path("america_audit_rtu_runtime_prerequisites.zip")
          data = base64.b64decode(src.read_text(encoding="ascii"), validate=True)
          if len(data) < 30_000:
              raise SystemExit(f"RTU runtime prerequisites overlay is unexpectedly small: {len(data)} bytes")
          out.write_bytes(data)
          print(f"RTU runtime prerequisites bytes: {len(data)}")
          PY

          project="src/AmericaAudit_Desktop_1.0.0"
          ditto -x -k america_audit_rtu_runtime_prerequisites.zip "$project"

          grep -q "pytesseract" "$project/backend/requirements.txt"
          grep -q "ocr_pdf" "$project/backend/app/taxpayer_profile/pdf_text.py"

          echo "OCR/document runtime prerequisites applied successfully."

      - name: Apply generalized RTU engine v2
        shell: bash
        run: |
          set -euo pipefail

          parts=(rtu_engine_v2_payload/part_*.txt)
          if [ "${#parts[@]}" -ne 6 ]; then
            echo "Expected 6 RTU engine v2 payload chunks; found ${#parts[@]}." >&2
            exit 1
          fi

          cat "${parts[@]}" | tr -d '\r\n\t ' > america_audit_rtu_engine_v2.zip.b64

          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          src = Path("america_audit_rtu_engine_v2.zip.b64")
          out = Path("america_audit_rtu_engine_v2.zip")
          data = base64.b64decode(src.read_text(encoding="ascii"), validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = "d250b3bb485db639712a51ee5bda7e7b166636c56240e902aa76bcb955a8b7b0"
          if digest != expected:
              raise SystemExit(f"RTU engine v2 payload hash mismatch: {digest}")
          out.write_bytes(data)
          print(f"RTU engine v2 bytes: {len(data)}; sha256={digest}")
          PY

          project="src/AmericaAudit_Desktop_1.0.0"
          ditto -x -k america_audit_rtu_engine_v2.zip "$project"

          test -f "$project/backend/app/taxpayer_profile/rtu_semantic.py"
          test -f "$project/backend/tests/test_rtu_generalization.py"
          grep -q "looks_like_rtu_text" "$project/backend/app/ingestion/detector.py"
          grep -q "apply_semantic_overrides" "$project/backend/app/taxpayer_profile/rtu_parser.py"

          echo "Generalized RTU engine v2 applied and checksum verified."

      - name: Apply RTU engine v2 hotfix
        shell: bash
        run: |
          set -euo pipefail

          parts=(rtu_engine_v2_hotfix_payload/hotfix_*.txt)
          if [ "${#parts[@]}" -ne 2 ]; then
            echo "Expected 2 RTU engine hotfix payload chunks; found ${#parts[@]}." >&2
            exit 1
          fi

          cat "${parts[@]}" | tr -d '\r\n\t ' > america_audit_rtu_engine_v2_hotfix.zip.b64

          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          src = Path("america_audit_rtu_engine_v2_hotfix.zip.b64")
          out = Path("america_audit_rtu_engine_v2_hotfix.zip")
          data = base64.b64decode(src.read_text(encoding="ascii"), validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = "7e8e662faa7b8a9e068609cfcbd78a0f9ecb7ebeb7d06bd993eca21221e95b1d"
          if digest != expected:
              raise SystemExit(f"RTU engine v2 hotfix payload hash mismatch: {digest}")
          out.write_bytes(data)
          print(f"RTU engine hotfix bytes: {len(data)}; sha256={digest}")
          PY

          project="src/AmericaAudit_Desktop_1.0.0"
          ditto -x -k america_audit_rtu_engine_v2_hotfix.zip "$project"

          grep -q "_legacy_pdf_envelope_ok" "$project/backend/app/ingestion/validation.py"
          grep -q 'current = profile.fields\["establecimientos"\]' "$project/backend/app/taxpayer_profile/rtu_semantic.py"

          echo "RTU engine v2 hotfix applied and checksum verified."

      - name: Apply RTU engine v3
        shell: bash
        run: |
          set -euo pipefail

          parts=(rtu_engine_v3_payload/v3_*.txt)
          if [ "${#parts[@]}" -ne 9 ]; then
            echo "Expected 9 RTU engine v3 payload chunks; found ${#parts[@]}." >&2
            exit 1
          fi

          cat "${parts[@]}" | tr -d '\r\n\t ' > america_audit_rtu_engine_v3.zip.b64

          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          src = Path("america_audit_rtu_engine_v3.zip.b64")
          out = Path("america_audit_rtu_engine_v3.zip")
          data = base64.b64decode(src.read_text(encoding="ascii"))
          digest = hashlib.sha256(data).hexdigest()
          expected = "a56dc42ef29886602acf3048071af3970f41ae9126318dea0fe6c67f79a4faf5"
          if digest != expected:
              raise SystemExit(f"RTU engine v3 payload hash mismatch: {digest}")
          out.write_bytes(data)
          print(f"RTU engine v3 bytes: {len(data)}; SHA256: {digest}")
          PY

          project="src/AmericaAudit_Desktop_1.0.0"
          ditto -x -k america_audit_rtu_engine_v3.zip "$project"

          test -f "$project/backend/app/taxpayer_profile/rtu_resilient.py"
          grep -q "RTU_DUAL_READ" "$project/backend/app/taxpayer_profile/pdf_text.py"
          grep -q "apply_resilient_overrides" "$project/backend/app/taxpayer_profile/rtu_parser.py"
          grep -q 'get_text("text", sort=True)' "$project/backend/app/ingestion/detector.py"

          echo "RTU engine v3 applied and checksum verified."

      - name: Apply macOS packaging overlay
        shell: bash
        run: |
          set -euo pipefail
          project="src/AmericaAudit_Desktop_1.0.0"
          cp packaging/macos/paths.py "$project/desktop/paths.py"
          cp packaging/macos/america_audit_macos.spec "$project/america_audit_macos.spec"

      - name: Apply packaged-runtime logging hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/windows/patch_runtime.py
          launcher="src/AmericaAudit_Desktop_1.0.0/desktop/desktop_launcher.py"
          grep -q "log_config=None" "$launcher"
          grep -q "/api/v1/health" "$launcher"
          if grep -q "/api/v1/system/health" "$launcher"; then
            echo "Obsolete health-check URL is still present." >&2
            exit 1
          fi

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply client deletion feature
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          encoded = Path("client_delete_payload/patch_client_delete.py.gz.b64").read_text(encoding="ascii").strip()
          raw = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(raw).hexdigest()
          expected = "9b5e07892b763da00725383b6ea665cd5d2f1e4ff0f6314bf159a3a75d0a83db"
          if digest != expected:
              raise SystemExit(f"Client delete patch hash mismatch: {digest}")
          Path("patch_client_delete.py").write_bytes(raw)
          PY

          python3 patch_client_delete.py --project "src/AmericaAudit_Desktop_1.0.0"

          project="src/AmericaAudit_Desktop_1.0.0"
          grep -Fq '@router.delete("/{client_id}", status_code=204)' "$project/backend/app/clients/router.py"
          grep -Fq 'CLIENTS_DELETE = "clients:delete"' "$project/backend/app/auth/permissions.py"
          grep -Fq 'Eliminar' "$project/frontend/src/pages/Clients.tsx"

          echo "Client deletion feature applied successfully."

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        shell: bash
        working-directory: src/AmericaAudit_Desktop_1.0.0
        run: |
          set -euo pipefail
          python -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/pip install -r backend/requirements.txt
          .build-venv/bin/pip install -r backend/requirements-dev.txt
          .build-venv/bin/pip install pillow
          .build-venv/bin/pip install pyobjc-framework-Vision pyobjc-framework-Quartz

          echo "Python:"
          .build-venv/bin/python --version
          echo "Machine:"
          uname -m

      - name: Generate macOS app icon
        shell: bash
        working-directory: src/AmericaAudit_Desktop_1.0.0
        run: |
          set -euo pipefail

          rm -rf assets/AmericaAudit.iconset
          mkdir -p assets/AmericaAudit.iconset

          .build-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/america_audit.ico")
          out = Path("assets/AmericaAudit.iconset")
          img = Image.open(src).convert("RGBA")

          files = {
              "icon_16x16.png": 16,
              "icon_16x16@2x.png": 32,
              "icon_32x32.png": 32,
              "icon_32x32@2x.png": 64,
              "icon_128x128.png": 128,
              "icon_128x128@2x.png": 256,
              "icon_256x256.png": 256,
              "icon_256x256@2x.png": 512,
              "icon_512x512.png": 512,
              "icon_512x512@2x.png": 1024,
          }

          for name, size in files.items():
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(out / name)
          PY

          iconutil -c icns assets/AmericaAudit.iconset -o assets/america_audit.icns
          test -s assets/america_audit.icns

      - name: Backend tests
        shell: bash
        working-directory: src/AmericaAudit_Desktop_1.0.0
        run: |
          set -euo pipefail
          rm -rf .pytest_ci
          mkdir -p .pytest_ci
          (
            cd backend
            ../.build-venv/bin/python -m pytest --basetemp="../.pytest_ci"
          )

      - name: Frontend tests and production build
        shell: bash
        working-directory: src/AmericaAudit_Desktop_1.0.0/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Build America Audit.app
        shell: bash
        working-directory: src/AmericaAudit_Desktop_1.0.0
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          set -euo pipefail
          rm -rf build dist release dmg-root
          .build-venv/bin/pyinstaller --clean --noconfirm america_audit_macos.spec

          app="dist/America Audit.app"
          test -d "$app"
          test -x "$app/Contents/MacOS/AmericaAudit"

          echo "Bundle architecture:"
          file "$app/Contents/MacOS/AmericaAudit"

          # Ad-hoc signing makes the bundle internally consistent.
          # Developer ID signing/notarization can be layered on later.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          plutil -p "$app/Contents/Info.plist"

      - name: Create DMG
        shell: bash
        working-directory: src/AmericaAudit_Desktop_1.0.0
        run: |
          set -euo pipefail
          mkdir -p release dmg-root

          cp -R "dist/America Audit.app" "dmg-root/America Audit.app"
          ln -s /Applications "dmg-root/Applications"

          dmg="release/AmericaAudit_1.0.0_macOS_${{ matrix.arch }}.dmg"

          hdiutil create \
            -volname "America Audit" \
            -srcfolder "dmg-root" \
            -ov \
            -format UDZO \
            "$dmg"

          test -s "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"

          echo "Created:"
          ls -lh "$dmg" "$dmg.sha256"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: AmericaAudit_1.0.0_macOS_${{ matrix.arch }}
          path: |
            src/AmericaAudit_Desktop_1.0.0/release/AmericaAudit_1.0.0_macOS_${{ matrix.arch }}.dmg
            src/AmericaAudit_Desktop_1.0.0/release/AmericaAudit_1.0.0_macOS_${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AmericaAudit-macOS-${{ matrix.arch }}-diagnostics
          path: |
            src/AmericaAudit_Desktop_1.0.0/build/**
            src/AmericaAudit_Desktop_1.0.0/dist/**
            src/AmericaAudit_Desktop_1.0.0/.pytest_ci/**
          if-no-files-found: ignore
          retention-days: 14
