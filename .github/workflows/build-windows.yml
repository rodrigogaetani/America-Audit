name: Build America Audit Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source_payload/**"
      - "automation_payload/**"
      - "rtu_robustness_payload/**"
      - "rtu_engine_v2_payload/**"
      - "rtu_engine_v2_hotfix_payload/**"
      - "rtu_engine_v3_payload/**"
      - "client_delete_payload/**"
      - "packaging/windows/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct America Audit source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $parts = Get-ChildItem "source_payload\payload_*.txt" | Sort-Object Name
          if (-not $parts -or $parts.Count -ne 8) {
            throw "Expected 8 source payload chunks; found $($parts.Count)."
          }

          $base64 = [string]::Concat(($parts | ForEach-Object {
            (Get-Content $_.FullName -Raw).Trim()
          }))

          Write-Host "Base64 payload length: $($base64.Length)"

          $bytes = [Convert]::FromBase64String($base64)
          $archive = Join-Path $PWD "AmericaAudit_Desktop_1.0.0_Windows_Builder_v2.zip"
          [IO.File]::WriteAllBytes($archive, $bytes)

          Write-Host "Archive bytes: $($bytes.Length)"
          if ($bytes.Length -lt 500000) {
            throw "Reconstructed archive is unexpectedly small."
          }

          Expand-Archive -Path $archive -DestinationPath "src" -Force

          if (-not (Test-Path "src\AmericaAudit_Desktop_1.0.0\build_windows.ps1")) {
            throw "Expected AmericaAudit_Desktop_1.0.0 project root was not found."
          }

      - name: Apply automation upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $parts = Get-ChildItem "automation_payload\overlay_*.txt" | Sort-Object Name
          if (-not $parts -or $parts.Count -ne 4) {
            throw "Expected 4 automation overlay chunks; found $($parts.Count)."
          }

          $base64 = [string]::Concat(($parts | ForEach-Object {
            (Get-Content $_.FullName -Raw).Trim()
          }))
          $bytes = [Convert]::FromBase64String($base64)
          $overlay = Join-Path $PWD "america_audit_automation_overlay.zip"
          [IO.File]::WriteAllBytes($overlay, $bytes)

          Write-Host "Automation overlay bytes: $($bytes.Length)"
          Expand-Archive -Path $overlay -DestinationPath "src\AmericaAudit_Desktop_1.0.0" -Force

          $project = "src\AmericaAudit_Desktop_1.0.0"
          if (-not (Select-String -Path "$project\frontend\src\pages\Clients.tsx" -Pattern "Crear automáticamente desde RTU" -Quiet)) {
            throw "RTU onboarding UI was not applied."
          }
          if (-not (Select-String -Path "$project\frontend\src\pages\Conversion.tsx" -Pattern "Cargar y convertir automáticamente" -Quiet)) {
            throw "Direct SAT conversion UI was not applied."
          }
          if (-not (Select-String -Path "$project\backend\app\taxpayer_profile\router.py" -Pattern "/create-client" -Quiet)) {
            throw "RTU onboarding endpoint was not applied."
          }

          Write-Host "Automation upgrade applied successfully."

      - name: Apply OCR/document runtime prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $parts = Get-ChildItem "rtu_robustness_payload\overlay_*.txt" | Sort-Object Name
          if (-not $parts -or $parts.Count -ne 7) {
            throw "Expected 7 RTU runtime prerequisite chunks; found $($parts.Count)."
          }

          $base64 = [string]::Concat(($parts | ForEach-Object {
            (Get-Content $_.FullName -Raw).Trim()
          }))
          $bytes = [Convert]::FromBase64String($base64)
          $overlay = Join-Path $PWD "america_audit_rtu_runtime_prerequisites.zip"
          [IO.File]::WriteAllBytes($overlay, $bytes)

          $project = "src\AmericaAudit_Desktop_1.0.0"
          Expand-Archive -Path $overlay -DestinationPath $project -Force

          if (-not (Select-String -Path "$project\backend\requirements.txt" -Pattern "pytesseract" -Quiet)) {
            throw "OCR dependency pytesseract was not applied."
          }
          if (-not (Select-String -Path "$project\backend\app\taxpayer_profile\pdf_text.py" -Pattern "ocr_pdf" -Quiet)) {
            throw "RTU PDF OCR fallback was not applied."
          }
          if (-not (Select-String -Path "$project\build_windows.ps1" -Pattern "Tesseract OCR" -Quiet)) {
            throw "Bundled Tesseract build support was not applied."
          }

          Write-Host "OCR/document runtime prerequisites applied successfully."

      - name: Apply generalized RTU engine v2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $parts = Get-ChildItem "rtu_engine_v2_payload\part_*.txt" | Sort-Object Name
          if (-not $parts -or $parts.Count -ne 6) {
            throw "Expected 6 RTU engine v2 payload chunks; found $($parts.Count)."
          }

          $base64 = [string]::Concat(($parts | ForEach-Object {
            (Get-Content $_.FullName -Raw).Trim()
          }))
          $bytes = [Convert]::FromBase64String($base64)
          $overlay = Join-Path $PWD "america_audit_rtu_engine_v2.zip"
          [IO.File]::WriteAllBytes($overlay, $bytes)

          $hash = (Get-FileHash $overlay -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "d250b3bb485db639712a51ee5bda7e7b166636c56240e902aa76bcb955a8b7b0") {
            throw "RTU engine v2 payload hash mismatch: $hash"
          }

          $project = "src\AmericaAudit_Desktop_1.0.0"
          Expand-Archive -Path $overlay -DestinationPath $project -Force

          if (-not (Test-Path "$project\backend\app\taxpayer_profile\rtu_semantic.py")) {
            throw "Generalized semantic RTU parser was not applied."
          }
          if (-not (Test-Path "$project\backend\tests\test_rtu_generalization.py")) {
            throw "RTU generalization tests were not applied."
          }
          if (-not (Select-String -Path "$project\backend\app\ingestion\detector.py" -Pattern "looks_like_rtu_text" -Quiet)) {
            throw "Semantic RTU detection was not applied."
          }
          if (-not (Select-String -Path "$project\backend\app\taxpayer_profile\rtu_parser.py" -Pattern "apply_semantic_overrides" -Quiet)) {
            throw "Semantic RTU parser integration was not applied."
          }

          Write-Host "Generalized RTU engine v2 applied and checksum verified."

      - name: Apply RTU engine v2 hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $parts = Get-ChildItem "rtu_engine_v2_hotfix_payload\hotfix_*.txt" | Sort-Object Name
          if (-not $parts -or $parts.Count -ne 2) {
            throw "Expected 2 RTU engine hotfix payload chunks; found $($parts.Count)."
          }

          $base64 = [string]::Concat(($parts | ForEach-Object {
            (Get-Content $_.FullName -Raw).Trim()
          }))
          $bytes = [Convert]::FromBase64String($base64)
          $overlay = Join-Path $PWD "america_audit_rtu_engine_v2_hotfix.zip"
          [IO.File]::WriteAllBytes($overlay, $bytes)

          $hash = (Get-FileHash $overlay -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "7e8e662faa7b8a9e068609cfcbd78a0f9ecb7ebeb7d06bd993eca21221e95b1d") {
            throw "RTU engine v2 hotfix payload hash mismatch: $hash"
          }

          $project = "src\AmericaAudit_Desktop_1.0.0"
          Expand-Archive -Path $overlay -DestinationPath $project -Force

          if (-not (Select-String -Path "$project\backend\app\ingestion\validation.py" -Pattern "_legacy_pdf_envelope_ok" -Quiet)) {
            throw "Legacy PDF preservation hotfix was not applied."
          }
          if (-not (Select-String -Path "$project\backend\app\taxpayer_profile\rtu_semantic.py" -SimpleMatch -Pattern 'current = profile.fields["establecimientos"]' -Quiet)) {
            throw "RTU commercial-name/establishment hotfix was not applied."
          }

          Write-Host "RTU engine v2 hotfix applied and checksum verified."

      - name: Apply RTU engine v3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $parts = Get-ChildItem "rtu_engine_v3_payload\v3_*.txt" | Sort-Object Name
          if (-not $parts -or $parts.Count -ne 9) {
            throw "Expected 9 RTU engine v3 payload chunks; found $($parts.Count)."
          }

          $base64 = [string]::Concat(($parts | ForEach-Object {
            (Get-Content $_.FullName -Raw).Trim()
          }))
          $bytes = [Convert]::FromBase64String($base64)
          $overlay = Join-Path $PWD "america_audit_rtu_engine_v3.zip"
          [IO.File]::WriteAllBytes($overlay, $bytes)

          $hash = (Get-FileHash $overlay -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "a56dc42ef29886602acf3048071af3970f41ae9126318dea0fe6c67f79a4faf5") {
            throw "RTU engine v3 payload hash mismatch: $hash"
          }

          $project = "src\AmericaAudit_Desktop_1.0.0"
          Expand-Archive -Path $overlay -DestinationPath $project -Force

          if (-not (Test-Path "$project\backend\app\taxpayer_profile\rtu_resilient.py")) {
            throw "RTU resilient parser was not applied."
          }
          if (-not (Select-String -Path "$project\backend\app\taxpayer_profile\pdf_text.py" -Pattern "RTU_DUAL_READ" -Quiet)) {
            throw "RTU dual-read OCR selection was not applied."
          }
          if (-not (Select-String -Path "$project\backend\app\taxpayer_profile\rtu_parser.py" -Pattern "apply_resilient_overrides" -Quiet)) {
            throw "RTU resilient parser integration was not applied."
          }
          if (-not (Select-String -Path "$project\backend\app\ingestion\detector.py" -SimpleMatch -Pattern 'get_text("text", sort=True)' -Quiet)) {
            throw "Sorted native PDF extraction was not applied."
          }

          Write-Host "RTU engine v3 applied and checksum verified."

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply client deletion feature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $payload = "client_delete_payload\patch_client_delete.py.gz.b64"
          $encoded = (Get-Content $payload -Raw).Trim()
          $gzipBytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes("patch_client_delete.py.gz", $gzipBytes)

          python -c "import gzip,hashlib,pathlib; b=gzip.decompress(pathlib.Path('patch_client_delete.py.gz').read_bytes()); assert hashlib.sha256(b).hexdigest() == '5cc1eb5bc9c2083da9eb460e6fe44768786f4b613a9ce34d825e097d955cfe25'; pathlib.Path('patch_client_delete.py').write_bytes(b)"

          python patch_client_delete.py --project "src\AmericaAudit_Desktop_1.0.0"

          $project = "src\AmericaAudit_Desktop_1.0.0"
          if (-not (Select-String -Path "$project\backend\app\clients\router.py" -SimpleMatch -Pattern '@router.delete("/{client_id}", status_code=204)' -Quiet)) {
            throw "Client DELETE endpoint was not applied."
          }
          if (-not (Select-String -Path "$project\backend\app\auth\permissions.py" -SimpleMatch -Pattern 'CLIENTS_DELETE = "clients:delete"' -Quiet)) {
            throw "Client delete permission was not applied."
          }
          if (-not (Select-String -Path "$project\frontend\src\pages\Clients.tsx" -SimpleMatch -Pattern 'Eliminar' -Quiet)) {
            throw "Client delete UI was not applied."
          }

          Write-Host "Client deletion feature applied successfully."

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply Windows runtime hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/windows/patch_runtime.py

          $launcher = Get-Content "src\AmericaAudit_Desktop_1.0.0\desktop\desktop_launcher.py" -Raw
          if ($launcher -notmatch "log_config=None") {
            throw "Windows runtime logging hotfix was not applied."
          }

      - name: Install Tesseract OCR for packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install tesseract --no-progress -y

          $tess = @(
            (Get-Command tesseract.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            "C:\Program Files\Tesseract-OCR\tesseract.exe",
            "C:\Program Files (x86)\Tesseract-OCR\tesseract.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1

          if (-not $tess) {
            throw "Tesseract OCR was not found after installation."
          }

          $tessRoot = Split-Path -Parent $tess
          $tessdata = Join-Path $tessRoot "tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null

          $spa = Join-Path $tessdata "spa.traineddata"
          if (-not (Test-Path $spa)) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/spa.traineddata" -OutFile $spa
          }

          if (-not (Test-Path (Join-Path $tessdata "eng.traineddata"))) {
            throw "Tesseract English language data is missing."
          }
          if (-not (Test-Path $spa)) {
            throw "Tesseract Spanish language data is missing."
          }

          Write-Host "Tesseract: $tess"
          & $tess --version
          & $tess --list-langs

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found after installation."
          }
          Write-Host "Inno Setup found at $iscc"

      - name: Patch builder for CI
        shell: pwsh
        working-directory: src/AmericaAudit_Desktop_1.0.0
        run: |
          $ErrorActionPreference = "Stop"

          # The local builder used invalid PowerShell syntax for ProgramFiles(x86).
          # Patch it in the runner so the checked Inno Setup installation is found.
          $scriptPath = "build_windows.ps1"
          $script = Get-Content $scriptPath -Raw
          $script = $script.Replace('$env:ProgramFiles(x86)', '${env:ProgramFiles(x86)}')
          Set-Content -Path $scriptPath -Value $script -Encoding utf8

          # Force the builder to use the Python 3.12 installed by setup-python,
          # instead of whichever version the Windows "py -3" launcher selects.
          if (Test-Path ".build-venv") {
            Remove-Item -Recurse -Force ".build-venv"
          }
          python -m venv .build-venv
          .\.build-venv\Scripts\python.exe --version

          $patched = Get-Content $scriptPath -Raw
          if ($patched -notmatch '\$\{env:ProgramFiles\(x86\)\}') {
            throw "CI patch for ProgramFiles(x86) was not applied."
          }

      - name: Build and test America Audit
        shell: pwsh
        working-directory: src/AmericaAudit_Desktop_1.0.0
        run: |
          $ErrorActionPreference = "Stop"
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build_windows.ps1

      - name: Verify installer
        shell: pwsh
        working-directory: src/AmericaAudit_Desktop_1.0.0
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "release\AmericaAudit_Setup_1.0.0.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not generated: $installer"
          }

          $item = Get-Item $installer
          Write-Host "Installer size: $($item.Length) bytes"

          if ($item.Length -lt 1000000) {
            throw "Installer appears unexpectedly small."
          }

          if (-not (Test-Path "$installer.sha256")) {
            $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
            "$hash  AmericaAudit_Setup_1.0.0.exe" | Set-Content "$installer.sha256" -Encoding ascii
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AmericaAudit_Setup_1.0.0
          path: |
            src/AmericaAudit_Desktop_1.0.0/release/AmericaAudit_Setup_1.0.0.exe
            src/AmericaAudit_Desktop_1.0.0/release/AmericaAudit_Setup_1.0.0.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AmericaAudit-build-diagnostics
          path: |
            src/AmericaAudit_Desktop_1.0.0/**/*.log
            src/AmericaAudit_Desktop_1.0.0/.pytest_tmp/**
            src/AmericaAudit_Desktop_1.0.0/build/**
            src/AmericaAudit_Desktop_1.0.0/dist/**
          if-no-files-found: ignore
          retention-days: 14
