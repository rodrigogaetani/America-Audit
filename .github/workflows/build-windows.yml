name: Build America Audit Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source_payload/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct America Audit source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $parts = Get-ChildItem "source_payload\payload_*.txt" | Sort-Object Name
          if (-not $parts -or $parts.Count -ne 8) {
            throw "Expected 8 source payload chunks; found $($parts.Count)."
          }

          $base64 = [string]::Concat(($parts | ForEach-Object {
            (Get-Content $_.FullName -Raw).Trim()
          }))

          Write-Host "Base64 payload length: $($base64.Length)"

          $bytes = [Convert]::FromBase64String($base64)
          $archive = Join-Path $PWD "AmericaAudit_Desktop_1.0.0_Windows_Builder_v2.zip"
          [IO.File]::WriteAllBytes($archive, $bytes)

          Write-Host "Archive bytes: $($bytes.Length)"
          if ($bytes.Length -lt 500000) {
            throw "Reconstructed archive is unexpectedly small."
          }

          Expand-Archive -Path $archive -DestinationPath "src" -Force

          if (-not (Test-Path "src\AmericaAudit_Desktop_1.0.0\build_windows.ps1")) {
            throw "Expected AmericaAudit_Desktop_1.0.0 project root was not found."
          }

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found after installation."
          }
          Write-Host "Inno Setup found at $iscc"

      - name: Patch builder for CI
        shell: pwsh
        working-directory: src/AmericaAudit_Desktop_1.0.0
        run: |
          $ErrorActionPreference = "Stop"

          # The local builder used invalid PowerShell syntax for ProgramFiles(x86).
          # Patch it in the runner so the checked Inno Setup installation is found.
          $scriptPath = "build_windows.ps1"
          $script = Get-Content $scriptPath -Raw
          $script = $script.Replace('$env:ProgramFiles(x86)', '${env:ProgramFiles(x86)}')
          Set-Content -Path $scriptPath -Value $script -Encoding utf8

          # Force the builder to use the Python 3.12 installed by setup-python,
          # instead of whichever version the Windows "py -3" launcher selects.
          if (Test-Path ".build-venv") {
            Remove-Item -Recurse -Force ".build-venv"
          }
          python -m venv .build-venv
          .\.build-venv\Scripts\python.exe --version

          $patched = Get-Content $scriptPath -Raw
          if ($patched -notmatch '\$\{env:ProgramFiles\(x86\)\}') {
            throw "CI patch for ProgramFiles(x86) was not applied."
          }

      - name: Build and test America Audit
        shell: pwsh
        working-directory: src/AmericaAudit_Desktop_1.0.0
        run: |
          $ErrorActionPreference = "Stop"
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build_windows.ps1

      - name: Verify installer
        shell: pwsh
        working-directory: src/AmericaAudit_Desktop_1.0.0
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "release\AmericaAudit_Setup_1.0.0.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not generated: $installer"
          }

          $item = Get-Item $installer
          Write-Host "Installer size: $($item.Length) bytes"

          if ($item.Length -lt 1000000) {
            throw "Installer appears unexpectedly small."
          }

          if (-not (Test-Path "$installer.sha256")) {
            $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
            "$hash  AmericaAudit_Setup_1.0.0.exe" | Set-Content "$installer.sha256" -Encoding ascii
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AmericaAudit_Setup_1.0.0
          path: |
            src/AmericaAudit_Desktop_1.0.0/release/AmericaAudit_Setup_1.0.0.exe
            src/AmericaAudit_Desktop_1.0.0/release/AmericaAudit_Setup_1.0.0.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AmericaAudit-build-diagnostics
          path: |
            src/AmericaAudit_Desktop_1.0.0/**/*.log
            src/AmericaAudit_Desktop_1.0.0/.pytest_tmp/**
            src/AmericaAudit_Desktop_1.0.0/build/**
            src/AmericaAudit_Desktop_1.0.0/dist/**
          if-no-files-found: ignore
          retention-days: 14
